name: Rollback or Redeploy Artifact

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Recovery target
        required: true
        type: choice
        options: [eint1, eint2, eint3, eint4, eint5, eint6, eqa, epreprod, prod]
      artifact_run_id:
        description: Successful Branch Delivery Pipeline run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Redeploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable scripts
        run: chmod +x scripts/*.sh

      - name: Download application artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          gh run download "$RUN_ID" \
            --name application-package \
            --dir promoted-artifact

      - name: Deploy and smoke test
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ./scripts/deploy.sh "$ENVIRONMENT" promoted-artifact
          ./scripts/smoke-test.sh "$ENVIRONMENT" promoted-artifact
