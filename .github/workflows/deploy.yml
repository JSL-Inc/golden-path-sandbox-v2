name: Rollback or Redeploy Artifact

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Recovery target; normal promotion is automatic
        required: true
        type: choice
        options: [eint1, eint2, eint3, eint4, eint5, eint6, eqa, epreprod, prod]
      artifact_name:
        required: true
        type: string
        default: application-package
      artifact_run_id:
        description: Successful Branch CI and Delivery run ID that produced the immutable artifact
        required: true
        type: string
      environment_url:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

# Recovery workflow only. Run it from a branch allowed by the selected GitHub
# Environment. The normal EINT, EQA, ePreProd, and production path is automatic.
jobs:
  deploy-controlled:
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: ${{ inputs.environment }}
      environment_url: ${{ inputs.environment_url }}
      artifact_name: ${{ inputs.artifact_name }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit
