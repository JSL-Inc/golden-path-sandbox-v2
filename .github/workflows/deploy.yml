name: Promote Artifact

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target protected GitHub Environment for a controlled promotion
        required: true
        type: choice
        options: [eint1, eint2, eint3, eint4, eint5, eint6, eqa, epreprod, prod]
      artifact_name:
        required: true
        type: string
        default: application-package
      artifact_run_id:
        description: Successful Standard CI run that produced the immutable artifact
        required: true
        type: number
      environment_url:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

# Use this workflow for controlled promotion to shared eqa/epreprod or for a rollback.
# Automatic eint1–eint6 and prod deployment is performed inside Standard CI so the
# deployment retains the actual source branch required by GitHub Environment rules.
jobs:
  deploy-controlled:
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: ${{ inputs.environment }}
      environment_url: ${{ inputs.environment_url }}
      artifact_name: ${{ inputs.artifact_name }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit
