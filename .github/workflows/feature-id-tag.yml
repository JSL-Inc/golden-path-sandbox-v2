name: Feature ID Tag

on:
  pull_request:
    types: [closed]
    branches:
      - "release-eqa-*"
      - "release-epreprod-*"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: feature-id-tag-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag-feature-id:
    name: Feature ID Tag
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feature-eint')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-feature-id-tag.yml@v2
    with:
      feature_branch: ${{ github.event.pull_request.head.ref }}
      release_branch: ${{ github.event.pull_request.base.ref }}
      merge_commit_sha: ${{ github.event.pull_request.merge_commit_sha }}
