name: Security Scanning

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  security:
    name: Security Scanning
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-security.yml@v2
    with:
      languages: '["python"]'
      dependency_review_enabled: ${{ vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
