name: Golden Path Promotion
on:
  pull_request:
    branches: [release-eqa-demo-quality-20261028, release-epreprod-demo-20261028]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  actions: read
jobs:
  promotion_gate:
    name: Promotion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require real delivery evidence for this PR commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f head_sha="$HEAD_SHA" -f event=push -f per_page=100)"
          run_id="$(jq -r '[.workflow_runs[] | select(.path == ".github/workflows/golden-path-cd.yml" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<< "$runs")"
          if [[ -n "$run_id" ]]; then
            jobs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            if jq -e '.jobs | any((.name == "INT Gate" or (.name | endswith("/ INT Gate"))) and .conclusion == "success")' <<< "$jobs" >/dev/null; then
              echo "Verified successful INT Gate for this exact PR commit." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          {
            echo "## Delivery checkpoint — expected rehearsal stop"
            echo
            echo "Build/test evidence and environment-delivery evidence are separate requirements."
            echo "No successful INT Gate was found for this PR commit."
            echo "This isolated rehearsal does not deploy to an environment."
            echo "The check remains failed; no successful delivery is invented."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Rehearsal stops here: real INT delivery evidence is not available for this commit."
          exit 1
