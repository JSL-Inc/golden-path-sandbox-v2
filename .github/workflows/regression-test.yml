name: Regression Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 3"
  push:
    branches:
      - "release-*"

permissions:
  contents: read

jobs:
  regression:
    name: Regression Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash .github/golden-path/prepare.sh
      - run: bash .github/golden-path/regression-test.sh
