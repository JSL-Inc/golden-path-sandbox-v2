name: Golden Path CD
on:
  push:
    branches: [feature-eint4-f9241, feature-eint5-f9242, feature-eint6-f9243, release-epreprod-demo-20261028, feature-eint1-f91028, feature-eint2-f91029]
  workflow_dispatch:
permissions:
  id-token: write
  actions: read
  contents: write
  pull-requests: read
jobs:
  delivery:
    name: Delivery
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-standard-cd.yml@5a44961adfc91267f6a1a868245cf4d6b17d7b27
    with:
      execute_delivery: false
      # Rehearsal uses the real package CI publishes. Original ACA config is retained under docs/demo-reference.
      artifact_type: package
      deployment_provider: azure-container-apps
      deploy_command: bash scripts/aca-deploy.sh
      production_verify_command: bash scripts/production-verify.sh
    secrets: inherit
