name: Branch Delivery Pipeline

on:
  push:
    branches:
      - "develop-*"
      - "feature-*"
      - "release-*"
      - "hotfix-*"

permissions:
  contents: read

concurrency:
  group: branch-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Determine Delivery Plan
    if: github.event.created == false
    runs-on: ubuntu-latest
    outputs:
      branch_type: ${{ steps.route.outputs.branch_type }}
      environment: ${{ steps.route.outputs.environment }}
      deploy: ${{ steps.route.outputs.deploy }}
    steps:
      - name: Determine branch behavior
        id: route
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          branch_type=""
          environment=""
          deploy=false

          case "$BRANCH" in
            develop-*)
              branch_type="develop"
              ;;
            feature-eint[1-6]-f[0-9]*)
              branch_type="feature"
              environment="${BRANCH#feature-}"
              environment="${environment%%-*}"
              deploy=true
              ;;
            release-eqa-*|hotfix-eqa-*)
              branch_type="${BRANCH%%-*}"
              environment="eqa"
              deploy=true
              ;;
            release-epreprod-*|hotfix-epreprod-*)
              branch_type="${BRANCH%%-*}"
              environment="epreprod"
              deploy=true
              ;;
            *)
              echo "::error::Unsupported branch name: $BRANCH"
              exit 1
              ;;
          esac

          {
            echo "branch_type=$branch_type"
            echo "environment=$environment"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI Quality Gate
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable scripts
        run: chmod +x scripts/*.sh

      - name: Prepare
        run: ./scripts/prepare.sh

      - name: Unit tests and coverage
        run: ./scripts/unit-test.sh

      - name: Code quality
        run: ./scripts/lint.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            reports/junit/results.xml
            reports/coverage/cobertura.xml
          if-no-files-found: error

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: dist/**
          if-no-files-found: error

  validate:
    name: Deploy and Validate ${{ needs.route.outputs.environment }}
    needs: [route, ci]
    if: needs.route.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.route.outputs.environment }}
    concurrency:
      group: environment-${{ needs.route.outputs.environment }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Enable scripts
        run: chmod +x scripts/*.sh

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: application-package
          path: promoted-artifact

      - name: Deploy
        env:
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: ./scripts/deploy.sh "$ENVIRONMENT" promoted-artifact

      - name: Smoke test
        env:
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: ./scripts/smoke-test.sh "$ENVIRONMENT" promoted-artifact

      - name: Integration tests
        env:
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: ./scripts/integration-test.sh "$ENVIRONMENT"

      - name: Regression tests
        if: needs.route.outputs.branch_type == 'release' || needs.route.outputs.branch_type == 'hotfix'
        env:
          ENVIRONMENT: ${{ needs.route.outputs.environment }}
        run: ./scripts/regression-test.sh "$ENVIRONMENT"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.route.outputs.environment }}-validation-evidence
          path: reports/**
          if-no-files-found: error

  promotion_gate:
    name: Promotion Gate
    needs: [route, ci, validate]
    if: always() && needs.route.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pipeline
        shell: bash
        env:
          DEPLOY_REQUIRED: ${{ needs.route.outputs.deploy }}
          CI_RESULT: ${{ needs.ci.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$CI_RESULT" != "success" ]]; then
            echo "::error::CI failed."
            exit 1
          fi

          if [[ "$DEPLOY_REQUIRED" == "true" && "$VALIDATION_RESULT" != "success" ]]; then
            echo "::error::Deployment or stage validation failed."
            exit 1
          fi

          echo "Promotion gate passed."
