name: Clean Pipeline Experiment

on:
  push:
    branches:
      - "develop-*"
      - "feature-*"
      - "release-*"
      - "hotfix-*"
      - "dependabot/**"
  workflow_dispatch:
    inputs:
      branch_context:
        description: Optional branch name to simulate, such as feature-eint2-f900 or release-eqa-clean-demo
        required: false
        type: string
        default: ""
      transition_exception:
        description: Approved coverage exception reference; blank enforces 80%
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: clean-pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery_plan:
    name: Delivery Plan
    if: >-
      github.event_name != 'push' ||
      github.event.created == false ||
      startsWith(github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    outputs:
      branch_context: ${{ steps.route.outputs.branch_context }}
      branch_type: ${{ steps.route.outputs.branch_type }}
      run_integration: ${{ steps.route.outputs.run_integration }}
      run_regression: ${{ steps.route.outputs.run_regression }}
      deploy: ${{ steps.route.outputs.deploy }}
      environment: ${{ steps.route.outputs.environment }}
    steps:
      - name: Resolve branch route
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_CONTEXT: ${{ inputs.branch_context }}
        run: |
          python - <<'PY'
          import os
          import re

          event_name = os.environ["EVENT_NAME"]
          requested = os.environ.get("REQUESTED_CONTEXT", "").strip()
          branch = requested if event_name == "workflow_dispatch" and requested else os.environ["REF_NAME"]

          branch_type = ""
          run_integration = False
          run_regression = False
          environment = ""

          if re.fullmatch(r"develop-[A-Za-z0-9._-]+", branch):
              branch_type = "develop"
          elif match := re.fullmatch(r"feature-eint([1-6])-f[0-9]+", branch):
              branch_type = "feature"
              run_integration = True
              environment = f"eint{match.group(1)}"
          elif match := re.fullmatch(
              r"(release|hotfix)-(eqa|epreprod)-[A-Za-z0-9][A-Za-z0-9._-]*",
              branch,
          ):
              branch_type = match.group(1)
              run_integration = True
              run_regression = True
              environment = match.group(2)
          elif branch.startswith("dependabot/"):
              branch_type = "dependency"
              run_integration = True
              run_regression = True
          else:
              raise SystemExit(
                  "Unsupported branch context. Expected develop-*, "
                  "feature-eint1-6-f###, release-eqa-*, release-epreprod-*, "
                  "hotfix-eqa-*, hotfix-epreprod-*, or dependabot/**."
              )

          values = {
              "branch_context": branch,
              "branch_type": branch_type,
              "run_integration": str(run_integration).lower(),
              "run_regression": str(run_regression).lower(),
              "deploy": str(bool(environment)).lower(),
              "environment": environment,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Publish delivery plan
        shell: bash
        run: |
          {
            echo "## Delivery plan"
            echo "- Branch context: \`${{ steps.route.outputs.branch_context }}\`"
            echo "- Branch type: \`${{ steps.route.outputs.branch_type }}\`"
            echo "- Integration tests: \`${{ steps.route.outputs.run_integration }}\`"
            echo "- Regression tests: \`${{ steps.route.outputs.run_regression }}\`"
            echo "- Deployment: \`${{ steps.route.outputs.environment || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  standard_ci:
    name: Standard CI
    needs: delivery_plan
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-ci.yml@v2
    with:
      prepare_command: bash .github/golden-path/prepare.sh
      unit_test_command: bash .github/golden-path/unit-test.sh
      build_command: bash .github/golden-path/build.sh
      lint_command: bash .github/golden-path/lint.sh
      junit_report_path: reports/junit/results.xml
      cobertura_report_path: reports/coverage/cobertura.xml
      coverage_threshold: 80
      enforce_coverage: ${{ inputs.transition_exception == '' }}
      exception_reference: ${{ inputs.transition_exception }}
      artifact_name: application-package
      artifact_path: dist/**

  stage_validation:
    name: Stage Validation
    needs: [delivery_plan, standard_ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        if: >-
          needs.delivery_plan.outputs.run_integration == 'true' ||
          needs.delivery_plan.outputs.run_regression == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare
        if: >-
          needs.delivery_plan.outputs.run_integration == 'true' ||
          needs.delivery_plan.outputs.run_regression == 'true'
        run: bash .github/golden-path/prepare.sh

      - name: Start integration database
        if: needs.delivery_plan.outputs.run_integration == 'true'
        shell: bash
        run: |
          docker run --detach --rm             --name golden-path-postgres             --env POSTGRES_PASSWORD=postgres             --env POSTGRES_USER=postgres             --env POSTGRES_DB=golden_path             --publish 5432:5432             postgres:16

          for attempt in {1..30}; do
            if docker exec golden-path-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::PostgreSQL did not become ready."
          exit 1

      - name: Run integration tests
        if: needs.delivery_plan.outputs.run_integration == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/golden_path
        run: bash .github/golden-path/integration-test.sh

      - name: Publish integration evidence
        if: >-
          always() &&
          needs.delivery_plan.outputs.run_integration == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: integration-evidence
          path: reports/integration/**
          if-no-files-found: error

      - name: Run regression tests
        if: needs.delivery_plan.outputs.run_regression == 'true'
        run: bash .github/golden-path/regression-test.sh

      - name: Publish regression evidence
        if: >-
          always() &&
          needs.delivery_plan.outputs.run_regression == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: regression-evidence
          path: reports/regression/**
          if-no-files-found: error

      - name: Record development-only validation
        if: >-
          needs.delivery_plan.outputs.run_integration != 'true' &&
          needs.delivery_plan.outputs.run_regression != 'true'
        run: echo "No integration or regression suite is required for this branch type."

      - name: Publish stage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Stage validation"
            echo "- Branch type: \`${{ needs.delivery_plan.outputs.branch_type }}\`"
            echo "- Integration: \`${{ needs.delivery_plan.outputs.run_integration }}\`"
            echo "- Regression: \`${{ needs.delivery_plan.outputs.run_regression }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ needs.delivery_plan.outputs.environment }}
    needs: [delivery_plan, standard_ci, stage_validation]
    if: >-
      always() &&
      needs.delivery_plan.outputs.deploy == 'true' &&
      needs.standard_ci.result == 'success' &&
      needs.stage_validation.result == 'success'
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: ${{ needs.delivery_plan.outputs.environment }}
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit
