name: Branch CI and Delivery

on:
  push:
    branches:
      - "develop-*"
      - "feature-*"
      - "release-*"
      - "hotfix-*"
      - "dependabot/**"
  workflow_dispatch:
    inputs:
      transition_exception:
        description: Approved coverage exception reference; blank enforces 80%
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: branch-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-ci:
    name: Standard CI
    if: >-
      github.event_name != 'push' ||
      github.event.created == false ||
      startsWith(github.ref_name, 'dependabot/')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-ci.yml@v2
    with:
      prepare_command: bash .github/golden-path/prepare.sh
      unit_test_command: bash .github/golden-path/unit-test.sh
      build_command: bash .github/golden-path/build.sh
      lint_command: bash .github/golden-path/lint.sh
      junit_report_path: reports/junit/results.xml
      cobertura_report_path: reports/coverage/cobertura.xml
      coverage_threshold: 80
      enforce_coverage: ${{ inputs.transition_exception == '' }}
      exception_reference: ${{ inputs.transition_exception }}
      artifact_name: application-package
      artifact_path: dist/**

  integration-test:
    name: Integration Test
    needs: standard-ci
    if: >-
      startsWith(github.ref_name, 'feature-') ||
      startsWith(github.ref_name, 'release-') ||
      startsWith(github.ref_name, 'hotfix-') ||
      startsWith(github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: golden_path
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare
        run: bash .github/golden-path/prepare.sh
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/golden_path
        run: bash .github/golden-path/integration-test.sh
      - name: Publish integration evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: integration-evidence
          path: reports/integration/**
          if-no-files-found: error

  regression-test:
    name: Regression Test
    needs: standard-ci
    if: >-
      startsWith(github.ref_name, 'release-') ||
      startsWith(github.ref_name, 'hotfix-') ||
      startsWith(github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare
        run: bash .github/golden-path/prepare.sh
      - name: Run regression tests
        run: bash .github/golden-path/regression-test.sh
      - name: Publish regression evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: regression-evidence
          path: reports/regression/**
          if-no-files-found: error

  deploy-eint1:
    name: Deploy eint1
    needs: [standard-ci, integration-test]
    if: startsWith(github.ref_name, 'feature-eint1-')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: eint1
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  deploy-eint2:
    name: Deploy eint2
    needs: [standard-ci, integration-test]
    if: startsWith(github.ref_name, 'feature-eint2-')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: eint2
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  deploy-eint3:
    name: Deploy eint3
    needs: [standard-ci, integration-test]
    if: startsWith(github.ref_name, 'feature-eint3-')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: eint3
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  deploy-eint4:
    name: Deploy eint4
    needs: [standard-ci, integration-test]
    if: startsWith(github.ref_name, 'feature-eint4-')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: eint4
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  deploy-eint5:
    name: Deploy eint5
    needs: [standard-ci, integration-test]
    if: startsWith(github.ref_name, 'feature-eint5-')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: eint5
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  deploy-eint6:
    name: Deploy eint6
    needs: [standard-ci, integration-test]
    if: startsWith(github.ref_name, 'feature-eint6-')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: eint6
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  deploy-eqa:
    name: Deploy eqa
    needs: [standard-ci, integration-test, regression-test]
    if: >-
      startsWith(github.ref_name, 'release-') ||
      startsWith(github.ref_name, 'hotfix-')
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: eqa
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  deploy-epreprod:
    name: Deploy epreprod
    needs: deploy-eqa
    if: needs.deploy-eqa.result == 'success'
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: epreprod
      artifact_name: application-package
      artifact_run_id: ${{ format('{0}', github.run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit
