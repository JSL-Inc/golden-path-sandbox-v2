name: OWASP ZAP Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed non-production URL
        required: true
        type: string
      blocking:
        description: Fail on ZAP findings
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dast:
    name: DAST
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/owasp-zap-scan.yml@main
    with:
      target_url: ${{ inputs.target_url }}
      blocking: ${{ inputs.blocking }}
