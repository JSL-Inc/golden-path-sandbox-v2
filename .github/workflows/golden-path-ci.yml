name: Golden Path CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - "develop-*"
      - "feature-*"
      - "release-*"
      - "hotfix-*"
      - main

permissions:
  contents: read
  code-quality: write
  id-token: write

concurrency:
  group: golden-path-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    if: github.event_name != 'push' || github.event.created == false
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-standard-ci.yml@v1.0.0a-aca
    with:
      prepare_command: python -m pip install -r requirements.txt
      build_command: bash scripts/build.sh
      unit_test_command: bash scripts/unit-test.sh
      lint_command: |
        ruff check testing
        ruff format --check testing
      coverage_language: python
      artifact_type: container
      registry_provider: acr
      acr_name: ${{ vars.ACR_NAME }}
      image_repository: ${{ vars.ACR_IMAGE_REPOSITORY }}
      container_build_command: bash scripts/aca-build.sh
      publish_artifact: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'feature-') || startsWith(github.ref_name, 'release-') || startsWith(github.ref_name, 'hotfix-')) }}
      artifact_name: application-package
    secrets: inherit
