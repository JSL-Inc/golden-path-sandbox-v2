name: Golden Path CI
on:
  pull_request:
    branches: [release-eqa-demo-quality-20261028]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [feature-eint1-f91028, feature-eint2-f91029]
  workflow_dispatch:
    inputs:
      run_artifactory:
        description: Perform a REAL Artifactory upload/download using configured demo credentials
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
  code-quality: write
concurrency:
  group: quality-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-standard-ci.yml@a5648a400d82708dbecb5221a532714e9d3a078d
    with:
      prepare_command: python -m pip install -r requirements.txt
      build_command: bash scripts/build.sh
      unit_test_command: bash scripts/unit-test.sh
      lint_command: |
        ruff check testing
        ruff format --check testing
      coverage_language: python
      artifact_type: package
      publish_artifact: true
      artifact_name: application-package
  artifact_evidence:
    name: Artifact integration evidence
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-package
          path: built-output
      - name: Package preview or explicitly requested real round trip
        uses: JSL-Inc/golden-path-workflows-v2/.github/actions/artifactory-evidence@a5648a400d82708dbecb5221a532714e9d3a078d
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && inputs.run_artifactory && 'roundtrip' || 'preview' }}
          source-path: built-output
          output-path: artifactory-evidence
          application-id: golden-path-demo
          repository: ${{ vars.DEMO_ARTIFACTORY_REPOSITORY || 'demo-packages' }}
          url: ${{ vars.DEMO_ARTIFACTORY_URL }}
          token: ${{ github.event_name == 'workflow_dispatch' && inputs.run_artifactory && secrets.DEMO_ARTIFACTORY_TOKEN || '' }}
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-integration-evidence
          path: artifactory-evidence/
          if-no-files-found: warn
