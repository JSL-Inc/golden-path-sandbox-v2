name: Optional DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed non-production URL
        required: true
        type: string
      blocking:
        description: Fail on ZAP findings
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dast:
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-dast.yml@simplified-version-1
    with:
      target_url: ${{ inputs.target_url }}
      rules_file: .zap/rules.tsv
      blocking: ${{ inputs.blocking }}
