name: Production Verification

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Informational version or release reference for a manual verification
        required: true
        type: string
      source_sha:
        description: Production commit SHA; leave blank to verify the selected ref
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-manually:
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-production-verification.yml@v2
    with:
      release_version: ${{ inputs.release_version }}
      source_sha: ${{ inputs.source_sha }}
      verification_command: bash .github/golden-path/production-verify.sh
