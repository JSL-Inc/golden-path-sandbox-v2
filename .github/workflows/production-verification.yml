name: Production Verification

on:
  workflow_run:
    workflows: ["Promote Artifact"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_version:
        description: Informational version or release reference for a manual verification
        required: true
        type: string
      source_sha:
        description: Production commit SHA; leave blank to verify the selected ref
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-after-prod:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-production-verification.yml@v2
    with:
      release_version: pending-automatic-release
      source_sha: ${{ github.event.workflow_run.head_sha }}
      verification_command: bash .github/golden-path/production-verify.sh

  verify-manually:
    if: github.event_name == 'workflow_dispatch'
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-production-verification.yml@v2
    with:
      release_version: ${{ inputs.release_version }}
      source_sha: ${{ inputs.source_sha }}
      verification_command: bash .github/golden-path/production-verify.sh
