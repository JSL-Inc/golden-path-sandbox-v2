name: Production Release

on:
  pull_request:
    types: [closed]
    branches: [main, new-deploy-stuff]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: production-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    name: Calculate Release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release-') || startsWith(github.head_ref, 'hotfix-'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_run_id: ${{ steps.artifact.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Calculate version from PR label
        id: version
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          count=0
          bump=""

          for label in major minor patch; do
            if [[ " $LABELS " == *" $label "* ]]; then
              count=$((count + 1))
              bump="$label"
            fi
          done

          if [[ "$count" -ne 1 ]]; then
            echo "::error::The merged PR must have exactly one release label."
            exit 1
          fi

          existing="$(git tag --points-at "$RELEASE_SHA" --list 'v[0-9]*' | head -n 1)"
          if [[ -n "$existing" ]]; then
            version="$existing"
          else
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"

            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac

            version="v${major}.${minor}.${patch}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Find validated release artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id="$(gh run list \
            --workflow new-deploy.yml \
            --branch "$SOURCE_BRANCH" \
            --commit "$SOURCE_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [[ -z "$run_id" ]]; then
            echo "::error::No successful release artifact was found for $SOURCE_BRANCH at $SOURCE_SHA."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  release:
    name: Deploy, Verify, and Release
    needs: plan
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Enable scripts
        run: chmod +x scripts/*.sh

      - name: Download validated artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.plan.outputs.artifact_run_id }}
        run: |
          gh run download "$RUN_ID" \
            --name application-package \
            --dir promoted-artifact

      - name: Deploy and smoke test
        run: |
          ./scripts/deploy.sh prod promoted-artifact
          ./scripts/smoke-test.sh prod promoted-artifact

      - name: Verify production
        run: |
          mkdir -p reports/production
          ./scripts/production-verify.sh \
            | tee reports/production/verification.txt

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: reports/production/verification.txt
          if-no-files-found: error

      - name: Package release artifact
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: tar -czf "release-${VERSION}.tgz" -C promoted-artifact .

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already exists; nothing to recreate."
          else
            gh release create "$VERSION" \
              "release-${VERSION}.tgz" \
              "reports/production/verification.txt" \
              --target "$RELEASE_SHA" \
              --title "$VERSION" \
              --generate-notes
          fi

      - name: Publish summary
        run: |
          {
            echo "## ${{ needs.plan.outputs.version }} released"
            echo "- Artifact run: ${{ needs.plan.outputs.artifact_run_id }}"
            echo "- Environment: prod"
            echo "- Verification evidence retained"
            echo "- GitHub Release created"
          } >> "$GITHUB_STEP_SUMMARY"
