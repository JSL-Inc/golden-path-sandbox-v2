name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: Merged PR to main with exactly one release label
        required: true
        type: number
      verification_run_id:
        description: Successful production-verification workflow run ID
        required: false
        type: number
        default: 0
      dry_run:
        description: Calculate without creating the tag or GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  release:
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-release.yml@v2
    with:
      release_pr_number: ${{ inputs.release_pr_number }}
      verification_run_id: ${{ inputs.verification_run_id }}
      dry_run: ${{ inputs.dry_run }}
