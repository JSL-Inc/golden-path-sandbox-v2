name: Production Release

on:
  pull_request:
    types: [closed]
    branches: [main, new-deploy-stuff]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: production-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release-') ||
       startsWith(github.head_ref, 'hotfix-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Calculate version from PR label
        id: version
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          count=0
          bump=""

          for label in major minor patch; do
            if [[ " $LABELS " == *" $label "* ]]; then
              count=$((count + 1))
              bump="$label"
            fi
          done

          if [[ "$count" -ne 1 ]]; then
            echo "::error::The merged PR must have exactly one release label."
            exit 1
          fi

          existing="$(git tag --points-at "$RELEASE_SHA" --list 'v[0-9]*' | head -n 1)"
          if [[ -n "$existing" ]]; then
            version="$existing"
          else
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"

            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac

            version="v${major}.${minor}.${patch}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Wait for the production pipeline
        id: pipeline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.base_ref }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          for attempt in {1..20}; do
            run_id="$(gh run list \
              --workflow new-deploy.yml \
              --branch "$TARGET_BRANCH" \
              --commit "$RELEASE_SHA" \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"

            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Production pipeline run: $run_id"
              exit 0
            fi

            echo "Waiting for the production deployment and smoke test..."
            sleep 15
          done

          echo "::error::The production pipeline did not complete successfully."
          exit 1

      - name: Download the production artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.pipeline.outputs.run_id }}
        run: |
          gh run download "$RUN_ID" \
            --name application-package \
            --dir release-artifact

      - name: Package release evidence
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tar -czf "release-${VERSION}.tgz" -C release-artifact .

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already exists; nothing to recreate."
          else
            gh release create "$VERSION" \
              "release-${VERSION}.tgz" \
              --target "$RELEASE_SHA" \
              --title "$VERSION" \
              --generate-notes
          fi

      - name: Publish summary
        run: |
          {
            echo "## ${{ steps.version.outputs.version }} released"
            echo "- SemVer source: one PR label"
            echo "- Production pipeline: ${{ steps.pipeline.outputs.run_id }}"
            echo "- Production was not redeployed by this workflow"
            echo "- GitHub release and tag created"
          } >> "$GITHUB_STEP_SUMMARY"
