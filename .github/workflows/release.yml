name: Production Release

on:
  workflow_run:
    workflows: ["Branch Delivery Pipeline"]
    types: [completed]
    branches:
      - main
      - new-deploy-stuff-and-epreprod # POC testing only

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: production-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Calculate version from PR label
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" \
              --jq '[
                .[]
                | select(
                    .merged_at != null
                    and (
                      (.head.ref | startswith("release-"))
                      or
                      (.head.ref | startswith("hotfix-"))
                    )
                  )
              ][0].number'
          )"

          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            echo "::error::No merged release or hotfix PR was found."
            exit 1
          fi

          labels="$(
            gh pr view "$pr_number" \
              --json labels \
              --jq '[.labels[].name] | join(" ")'
          )"

          count=0
          bump=""

          for label in major minor patch; do
            if [[ " $labels " == *" $label "* ]]; then
              count=$((count + 1))
              bump="$label"
            fi
          done

          if [[ "$count" -ne 1 ]]; then
            echo "::error::PR #${pr_number} must have exactly one of: major, minor, patch."
            exit 1
          fi

          existing="$(
            git tag --points-at "$RELEASE_SHA" \
              --list 'v[0-9]*' |
              head -n 1
          )"

          if [[ -n "$existing" ]]; then
            version="$existing"
          else
            latest="$(
              git tag \
                --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-v:refname |
                head -n 1
            )"

            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"

            case "$bump" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
            esac

            version="v${major}.${minor}.${patch}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Download validated application package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" \
            --name application-package \
            --dir release-artifact

      - name: Package release artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "application-package-${VERSION}.tgz" \
            -C release-artifact .

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already exists; nothing to recreate."
          else
            gh release create "$VERSION" \
              "application-package-${VERSION}.tgz#Release Build Artifact" \
              --target "$RELEASE_SHA" \
              --title "Production Release ${VERSION}" \
              --generate-notes
          fi

      - name: Summary
        run: |
          {
            echo "## Production Release ${{ steps.version.outputs.version }}"
            echo "- Triggered after the Branch Delivery Pipeline completed successfully"
            echo "- Used the artifact from run ${{ github.event.workflow_run.id }}"
            echo "- GitHub release and tag created"
          } >> "$GITHUB_STEP_SUMMARY"
