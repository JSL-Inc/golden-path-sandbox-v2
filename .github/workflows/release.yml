name: Production Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: Merged release or hotfix PR number
        required: true
        type: string
      artifact_run_id:
        description: Successful Branch CI and Delivery run containing the release artifact
        required: true
        type: string
      release_commit_sha:
        description: Main commit that will be deployed, verified, tagged, and released
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: production-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve immutable release artifact
    if: github.event_name != 'push' || github.event.created == false
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.context.outputs.eligible }}
      release_pr_number: ${{ steps.context.outputs.release_pr_number }}
      artifact_run_id: ${{ steps.context.outputs.artifact_run_id }}
      release_commit_sha: ${{ steps.context.outputs.release_commit_sha }}
      source_branch: ${{ steps.context.outputs.source_branch }}
    steps:
      - name: Resolve merged release and successful artifact run
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.release_pr_number }}
          INPUT_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          INPUT_RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "eligible=true"
              echo "release_pr_number=$INPUT_PR_NUMBER"
              echo "artifact_run_id=$INPUT_ARTIFACT_RUN_ID"
              echo "release_commit_sha=$INPUT_RELEASE_COMMIT_SHA"
              echo "source_branch=manual-recovery"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > pull-requests.json

          python - <<'PY'
          import json
          import os

          with open("pull-requests.json", encoding="utf-8") as source:
              pull_requests = json.load(source)

          matches = [
              item for item in pull_requests
              if item.get("merged_at")
              and item.get("base", {}).get("ref") == "main"
              and item.get("head", {}).get("ref", "").startswith(
                  ("release-", "hotfix-", "dependabot/")
              )
          ]
          if len(matches) > 1:
              raise SystemExit(
                  "More than one merged release, hotfix, or dependency PR is associated "
                  "with this main commit"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if not matches:
                  output.write("eligible=false\n")
                  output.write(f"release_commit_sha={os.environ['GITHUB_SHA']}\n")
              else:
                  pull_request = matches[0]
                  output.write("eligible=true\n")
                  output.write(
                      f"release_pr_number={pull_request['number']}\n"
                  )
                  output.write(
                      f"source_branch={pull_request['head']['ref']}\n"
                  )
                  output.write(
                      f"source_sha={pull_request['head']['sha']}\n"
                  )
                  output.write(
                      f"release_commit_sha={os.environ['GITHUB_SHA']}\n"
                  )
          PY

          if [[ "$(grep '^eligible=' "$GITHUB_OUTPUT" | tail -1)" != "eligible=true" ]]; then
            echo "This main update was not a release/hotfix PR; production release is skipped."
            exit 0
          fi

          SOURCE_BRANCH="$(grep '^source_branch=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          SOURCE_SHA="$(grep '^source_sha=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          export SOURCE_BRANCH
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&event=push&status=success&per_page=25" \
            > workflow-runs.json

          python - <<'PY'
          import json
          import os

          with open("workflow-runs.json", encoding="utf-8") as source:
              runs = json.load(source).get("workflow_runs", [])
          source_branch = os.environ["SOURCE_BRANCH"]
          candidates = [
              run for run in runs
              if run.get("conclusion") == "success"
              and run.get("head_branch") == source_branch
          ]
          if not candidates:
              raise SystemExit(
                  "No successful Branch CI and Delivery run was found for "
                  f"{source_branch}. The release artifact cannot be promoted."
              )
          selected = max(candidates, key=lambda run: run["run_number"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_run_id={selected['id']}\n")
          PY

      - name: Resolution summary
        shell: bash
        run: |
          {
            echo "## Production release resolution"
            echo "- Eligible: ${{ steps.context.outputs.eligible }}"
            echo "- Source branch: ${{ steps.context.outputs.source_branch || 'not a release' }}"
            echo "- Release PR: ${{ steps.context.outputs.release_pr_number || 'not applicable' }}"
            echo "- Artifact run: ${{ steps.context.outputs.artifact_run_id || 'not applicable' }}"
            echo "- Main commit: ${{ steps.context.outputs.release_commit_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy prod
    needs: resolve-release
    if: needs.resolve-release.outputs.eligible == 'true'
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-deploy.yml@v2
    with:
      environment_name: prod
      artifact_name: application-package
      artifact_run_id: ${{ fromJSON(needs.resolve-release.outputs.artifact_run_id) }}
      deploy_command: bash .github/golden-path/deploy.sh
      smoke_test_command: bash .github/golden-path/smoke-test.sh
    secrets: inherit

  production-verification:
    name: Production Verification
    needs: [resolve-release, deploy-prod]
    if: needs.deploy-prod.result == 'success'
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-production-verification.yml@v2
    with:
      release_version: pending-semantic-release
      source_sha: ${{ needs.resolve-release.outputs.release_commit_sha }}
      verification_command: bash .github/golden-path/production-verify.sh

  semantic-release:
    name: Semantic Release
    needs: [resolve-release, production-verification]
    if: needs.production-verification.result == 'success'
    uses: JSL-Inc/golden-path-workflows-v2/.github/workflows/reusable-release.yml@v2
    with:
      release_pr_number: ${{ needs.resolve-release.outputs.release_pr_number }}
      verification_run_id: ${{ github.run_id }}
      release_commit_sha: ${{ needs.resolve-release.outputs.release_commit_sha }}
      dry_run: false
