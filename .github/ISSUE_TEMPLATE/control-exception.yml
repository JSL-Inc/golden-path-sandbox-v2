name: Golden Path control exception
description: Request a temporary, risk-accepted exception to a Golden Path control.
title: "[Exception] "
labels:
  - security-exception
body:
  - type: input
    id: control
    attributes:
      label: Control
      description: Name the control that cannot currently be met.
    validations:
      required: true
  - type: textarea
    id: justification
    attributes:
      label: Business and technical justification
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected environments
    validations:
      required: true
  - type: textarea
    id: compensating_controls
    attributes:
      label: Compensating controls
    validations:
      required: true
  - type: input
    id: rsam
    attributes:
      label: RSAM or audit variance
      description: Required when the applicable standard requires an audit variance.
  - type: input
    id: owner
    attributes:
      label: Owner
    validations:
      required: true
  - type: input
    id: expiration
    attributes:
      label: Expiration date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: remediation
    attributes:
      label: Remediation plan
    validations:
      required: true
